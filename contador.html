<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contagem Regressiva ❤️</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      background: url("fundo.jpg") no-repeat center center/cover;
    }

    /* camada escura pra melhorar leitura */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      top: 0;
      left: 0;
    }

    #container {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #fff;
    }

    #titulo {
      font-size: 28px;
      margin-bottom: 20px;
    }

    #contador {
      font-size: 50px;
      font-weight: bold;
      color: #00ffcc;
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div id="container">
  <div id="titulo">
    Contagem regressiva para ver a Ingrid ❤️
  </div>
  <div id="contador">Carregando...</div>
</div>

<script>
  const anoAtual = new Date().getFullYear();
  let dataAlvo = new Date(`${anoAtual}-06-12T00:00:00`);

  // se já passou, joga pro próximo ano
  if (new Date() > dataAlvo) {
    dataAlvo = new Date(`${anoAtual + 1}-06-12T00:00:00`);
  }

  function atualizarContador() {
    const agora = new Date();
    const diferenca = dataAlvo - agora;

    if (diferenca <= 0) {
      document.getElementById("contador").innerHTML = "Finalmente juntos ❤️";
      return;
    }

    const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
    const segundos = Math.floor((diferenca / 1000) % 60);

    document.getElementById("contador").innerHTML =
      `${dias}d ${horas}h ${minutos}m ${segundos}s`;
  }

  setInterval(atualizarContador, 1000);
  atualizarContador();
</script>

</body>
</html>
