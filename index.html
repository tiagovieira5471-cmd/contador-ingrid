<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem Regressiva ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
    }

    /* FUNDO COM BLUR (igual celular) */
    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;

      background: url("fundo.jpg") no-repeat center center;
      background-size: cover;
      filter: blur(20px) brightness(0.5);
      transform: scale(1.1);

      z-index: -2;
    }

    /* FOTO PRINCIPAL CENTRALIZADA */
    body::after {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;

      background: url("fundo.jpg") no-repeat center center;
      background-size: contain; /* NÃO corta a imagem */

      z-index: -1;
    }

    #container {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 500px;
    }

    #titulo {
      font-size: clamp(18px, 5vw, 28px);
      margin-bottom: 20px;
    }

    #contador {
      font-size: clamp(28px, 10vw, 50px);
      font-weight: bold;
      color: #00ffcc;
    }

    @media (max-width: 400px) {
      #titulo {
        font-size: 16px;
      }

      #contador {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div id="container">
  <div id="titulo">
    Contagem regressiva para ver a Ingrid ❤️
  </div>
  <div id="contador">Carregando...</div>
</div>

<script>
  const anoAtual = new Date().getFullYear();
  let dataAlvo = new Date(`${anoAtual}-06-12T00:00:00`);

  if (new Date() > dataAlvo) {
    dataAlvo = new Date(`${anoAtual + 1}-06-12T00:00:00`);
  }

  function atualizarContador() {
    const agora = new Date();
    const diferenca = dataAlvo - agora;

    if (diferenca <= 0) {
      document.getElementById("contador").innerHTML = "Finalmente juntos ❤️";
      return;
    }

    const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
    const segundos = Math.floor((diferenca / 1000) % 60);

    document.getElementById("contador").innerHTML =
      `${dias}d ${horas}h ${minutos}m ${segundos}s`;
  }

  setInterval(atualizarContador, 1000);
  atualizarContador();
</script>

</body>
</html>
